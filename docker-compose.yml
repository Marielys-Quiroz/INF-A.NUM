services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000" 
      - "8000:8000"  
    environment:
      - API_URL=http://backend:8001
      - REFLEX_BACKEND_URL=http://localhost:8000
      - FRONTEND_HOST=0.0.0.0
    depends_on:
      - backend